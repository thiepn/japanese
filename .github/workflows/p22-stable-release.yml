name: P22 Stable Release Activation

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character commit previously tested on the physical device
        required: true
        type: string
      release_tag:
        description: Immutable stable release tag, for example japanese-v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate activation inputs
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "$RELEASE_COMMIT" | grep -Eq '^[0-9a-fA-F]{40}$'
          echo "$RELEASE_TAG" | grep -Eq '^japanese-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Verify checked-out commit
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:content

      - name: Validate native candidate queue
        run: pnpm native:p10:preview

      - name: Audit native provenance
        run: pnpm native:p11:audit

      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - name: Record P9 regression evidence
        run: |
          mkdir -p artifacts
          cat > artifacts/p9-regression-evidence.json <<'JSON'
          {
            "typecheck": true,
            "unitTests": true,
            "contentValidation": true,
            "productionBuild": true,
            "e2e": true,
            "offlineDrill": true,
            "providerOutageDrill": true,
            "longHistoryDrill": true
          }
          JSON

      - name: Run strict P11 external release qualification
        run: pnpm qualify:p11:strict --regression artifacts/p9-regression-evidence.json

      - name: Record P21 consolidation evidence
        run: |
          cat > artifacts/p21-regression-evidence.json <<'JSON'
          {
            "typecheck": true,
            "unitTests": true,
            "contentValidation": true,
            "nativeProvenanceAudit": true,
            "productionBuild": true,
            "e2e": true,
            "desktopViewport": true,
            "androidViewport": true,
            "compactViewport": true,
            "pwaOffline": true,
            "accessibilitySmoke": true,
            "privateAudioBoundary": true
          }
          JSON

      - name: Run strict P21 stable-release gate
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: pnpm certify:p21:strict --regression artifacts/p21-regression-evidence.json --device release/p21-device-acceptance.json --p11 artifacts/p11-release-candidate-qualification.json --commit "$RELEASE_COMMIT"

      - name: Write immutable P22 release identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: pnpm release:p22:meta -- --commit "$RELEASE_COMMIT" --channel stable

      - name: Build stable artifact with release identity
        run: pnpm build

      - name: Package static release
        run: tar -C apps/web/dist -czf artifacts/japanese-stable-web.tgz .

      - name: Refuse tag overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists and is immutable: $RELEASE_TAG"
            exit 1
          fi

      - name: Create immutable GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          gh release create "$RELEASE_TAG"             artifacts/japanese-stable-web.tgz             artifacts/p11-release-candidate-qualification.json             artifacts/p21-release-candidate.json             artifacts/p21-release-candidate.md             --target "$RELEASE_COMMIT"             --title "Japanese $RELEASE_TAG"             --notes "P22 stable source release. Strict P11 and P21 gates passed for commit $RELEASE_COMMIT. Production deployment and monitoring remain separate evidence."

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p22-stable-release-activation
          path: |
            artifacts/p9-regression-evidence.json
            artifacts/p11-release-candidate-qualification.json
            artifacts/p11-release-candidate-qualification.md
            artifacts/p21-regression-evidence.json
            artifacts/p21-release-candidate.json
            artifacts/p21-release-candidate.md
            artifacts/japanese-stable-web.tgz
