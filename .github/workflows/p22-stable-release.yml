name: P22 Stable Release Activation

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact 40-character product commit previously tested on the physical device
        required: true
        type: string
      release_tag:
        description: Immutable stable release tag, for example japanese-v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate activation inputs
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "$RELEASE_COMMIT" | grep -Eq '^[0-9a-fA-F]{40}$'
          echo "$RELEASE_TAG" | grep -Eq '^japanese-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

      - name: Checkout latest admitted release evidence
        uses: actions/checkout@v4
        with:
          ref: main
          path: evidence
          fetch-depth: 1

      - name: Checkout immutable product candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          path: candidate
          fetch-depth: 0

      - name: Verify candidate and overlay post-build evidence
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$RELEASE_COMMIT"
          cp evidence/release/p11-external-validation.json candidate/release/p11-external-validation.json
          cp evidence/release/p21-device-acceptance.json candidate/release/p21-device-acceptance.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Install candidate dependencies
        working-directory: candidate
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck candidate
        working-directory: candidate
        run: pnpm typecheck

      - name: Test candidate
        working-directory: candidate
        run: pnpm test

      - name: Validate canonical content
        working-directory: candidate
        run: pnpm validate:content

      - name: Validate P22 defect-only maintenance ledger
        working-directory: candidate
        run: pnpm validate:p22:maintenance

      - name: Validate native candidate queue
        working-directory: candidate
        run: pnpm native:p10:preview

      - name: Audit native provenance
        working-directory: candidate
        run: pnpm native:p11:audit

      - name: Build candidate
        working-directory: candidate
        run: pnpm build

      - name: Install Playwright Chromium
        working-directory: candidate
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete browser acceptance
        working-directory: candidate
        run: pnpm test:e2e

      - name: Record P9 regression evidence
        working-directory: candidate
        run: |
          mkdir -p artifacts
          cat > artifacts/p9-regression-evidence.json <<'JSON'
          {
            "typecheck": true,
            "unitTests": true,
            "contentValidation": true,
            "productionBuild": true,
            "e2e": true,
            "offlineDrill": true,
            "providerOutageDrill": true,
            "longHistoryDrill": true
          }
          JSON

      - name: Run strict P11 external release qualification
        working-directory: candidate
        run: pnpm qualify:p11:strict --regression artifacts/p9-regression-evidence.json

      - name: Record P21 consolidation evidence
        working-directory: candidate
        run: |
          cat > artifacts/p21-regression-evidence.json <<'JSON'
          {
            "typecheck": true,
            "unitTests": true,
            "contentValidation": true,
            "nativeProvenanceAudit": true,
            "productionBuild": true,
            "e2e": true,
            "desktopViewport": true,
            "androidViewport": true,
            "compactViewport": true,
            "pwaOffline": true,
            "accessibilitySmoke": true,
            "privateAudioBoundary": true
          }
          JSON

      - name: Run strict P21 stable-release gate
        working-directory: candidate
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: pnpm certify:p21:strict --regression artifacts/p21-regression-evidence.json --device release/p21-device-acceptance.json --p11 artifacts/p11-release-candidate-qualification.json --commit "$RELEASE_COMMIT"

      - name: Write immutable P22 release identity
        working-directory: candidate
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: pnpm release:p22:meta --commit "$RELEASE_COMMIT" --channel stable

      - name: Build stable artifact with release identity
        working-directory: candidate
        run: pnpm build

      - name: Package static release and digest
        working-directory: candidate
        run: |
          tar -C apps/web/dist -czf artifacts/japanese-stable-web.tgz .
          sha256sum artifacts/japanese-stable-web.tgz | awk '{print $1}' > artifacts/japanese-stable-web.sha256

      - name: Refuse tag overwrite
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists and is immutable: $RELEASE_TAG"
            exit 1
          fi

      - name: Create immutable GitHub stable release
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/japanese-stable-web.tgz \
            artifacts/japanese-stable-web.sha256 \
            artifacts/p11-release-candidate-qualification.json \
            artifacts/p21-release-candidate.json \
            artifacts/p21-release-candidate.md \
            --target "$RELEASE_COMMIT" \
            --title "Japanese $RELEASE_TAG" \
            --notes "P22 stable source release. Strict P11 and P21 gates passed for product commit $RELEASE_COMMIT using separately admitted post-build human/device evidence. Production deployment and monitoring remain separate evidence."

      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p22-stable-release-activation
          path: |
            candidate/artifacts/p9-regression-evidence.json
            candidate/artifacts/p11-release-candidate-qualification.json
            candidate/artifacts/p11-release-candidate-qualification.md
            candidate/artifacts/p21-regression-evidence.json
            candidate/artifacts/p21-release-candidate.json
            candidate/artifacts/p21-release-candidate.md
            candidate/artifacts/p22-maintenance-summary.json
            candidate/artifacts/japanese-stable-web.tgz
            candidate/artifacts/japanese-stable-web.sha256
