name: Kana Studio Canonical Bridge Build
on:
  push:
    branches: [feature/kana-studio-canonical-bridge-20261026]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vitest run tests/kana-studio-canonical.test.ts
      - run: pnpm build
      - name: Confirm both Japanese and Kana entry points
        run: |
          test -s apps/web/dist/index.html
          test -s apps/web/dist/kana/index.html
