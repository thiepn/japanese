name: CUR-01 Course Catalog Qualification
on:
  push:
    branches:
      - feature/cur01-six-level-curriculum-20261026
permissions:
  contents: read
concurrency:
  group: cur01-japanese-${{ github.ref }}
  cancel-in-progress: true
jobs:
  course:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck existing app and CUR-01
        run: pnpm typecheck
      - name: Run native course and catalog regression tests
        run: pnpm exec vitest run tests/study-player/cur01-catalog.test.ts tests/study-player/grammar-course.test.ts tests/study-player/study-player.test.ts
      - name: Build Japanese without deployment
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Real desktop and mobile course navigation
        run: pnpm exec playwright test tests/e2e/cur01-catalog.spec.ts --project=desktop-chromium --project=compact-mobile --workers=2
