name: Japanese PR 126 current-main integration

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]

permissions:
  contents: read

jobs:
  integrated-candidate:
    if: github.event.pull_request.number == 126 && github.event.pull_request.head.ref == 'fix/postmerge-account-origin-20261102'
    runs-on: ubuntu-latest
    env:
      EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify actual current remote main plus immutable PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PR_HEAD"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          BASE_SHA="$(git rev-parse refs/remotes/origin/main)"
          echo "Current remote main: $BASE_SHA"
          echo "Exact PR head: $EXPECTED_PR_HEAD"
          echo "TESTED_CURRENT_MAIN_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git config user.name 'Japanese Integration Verification'
          git config user.email 'japanese-integration@users.noreply.github.com'
          git checkout --detach "$BASE_SHA"
          git merge --no-ff --no-edit "$EXPECTED_PR_HEAD"
          test "$(git rev-parse HEAD^1)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PR_HEAD"
          echo "Temporary merged tree: $(git rev-parse HEAD)"
          {
            echo "### Actual isolated current-main merge"
            echo "Base: \`$BASE_SHA\`"
            echo "PR head: \`$EXPECTED_PR_HEAD\`"
            echo "Result: temporary merge created on runner only; no push and no ancestry rewrite"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - name: Full integrated unit suite
        run: pnpm test
      - run: pnpm validate:content
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Account, mobile, new UI focus and Kana persistence on merged tree
        run: >-
          pnpm exec playwright test
          tests/e2e/j17-account-panel.spec.ts
          tests/e2e/j20-device-recovery.spec.ts
          tests/e2e/ui-defect-regressions.spec.ts
          tests/e2e/kana-native-integration.spec.ts
          tests/e2e/kana-single-app-progress.spec.ts
          --project desktop-chromium
          --project android-mobile
          --project compact-mobile
      - name: Confirm remote main and PR SHA did not move during verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$TESTED_CURRENT_MAIN_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_PR_HEAD"
          echo "Main and PR exact-SHA integration remained unchanged." >> "$GITHUB_STEP_SUMMARY"
