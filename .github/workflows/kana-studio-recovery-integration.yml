name: Kana Studio Recovery Integration
on:
  push:
    branches: [feature/kana-studio-recovery-runtime-20261026, feature/kana-studio-portable-progress-20261026]
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.19.0}
      - uses: actions/setup-node@v4
        with: {node-version: 24.15.0}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec vitest run tests/kana-studio-canonical.test.ts
      - run: pnpm build
      - run: test -s apps/web/dist/kana/index.html
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify original Google Kana in real browser
        run: pnpm exec playwright test tests/e2e/kana-studio-runtime.spec.ts tests/e2e/kana-studio-portable.spec.ts --project=desktop-chromium --workers=1
