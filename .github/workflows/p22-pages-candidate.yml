name: P22 Candidate Pages Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: p22-pages-candidate
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Write candidate deployment identity
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: pnpm release:p22:meta --commit "$CANDIDATE_COMMIT" --channel candidate

      - name: Build GitHub Pages candidate
        env:
          VITE_PUBLIC_BASE: /japanese/
        run: pnpm build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy candidate to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
