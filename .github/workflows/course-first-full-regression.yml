name: Course-First A1 Full Playwright Regression
on:
  push:
    branches:
      - feature/course-first-a1-c0-c1
    paths:
      - ".github/workflows/course-first-full-regression.yml"
      - "apps/web/**"
      - "packages/**"
      - "tests/e2e/**"
      - "content/**"

permissions:
  contents: read

concurrency:
  group: course-first-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-chromium:
    name: All existing Chromium cases — shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - name: Install original pnpm workspace (no committed lockfile)
        run: pnpm install --no-frozen-lockfile
      - name: Produce actual release-mode browser bundle
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: All Playwright tests with original three viewport projects and CI repeats
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/8 --workers=2 --retries=0
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: course-first-playwright-traces-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore
