name: Shared Japanese Visual Phase 6
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [integration/japanese-v1-finalization-20261021]

permissions:
  contents: read

jobs:
  reference:
    if: github.event.pull_request.draft && github.head_ref == 'feature/shared-visual-japanese-j7-phase6'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - name: All 103 original images and 48-item cache acceptance
        run: pnpm exec vitest run tests/study/sharedJapaneseReferenceVisuals.test.ts tests/study/vocabVisuals.test.ts tests/study/vocab-image-cache.test.mjs tests/platform/pwa-cache-boundary.test.ts
      - name: TypeScript and original production PWA build
        run: pnpm typecheck && pnpm build
      - name: Genuine Chromium desktop and Android reference acceptance
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test tests/e2e/shared-vocab-reference.spec.ts tests/e2e/vocabulary-visuals.spec.ts --project=desktop-chromium --project=android-mobile
