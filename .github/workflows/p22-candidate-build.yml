name: P22 Candidate Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: p22-candidate-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Write candidate deployment identity
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: pnpm release:p22:meta --commit "$CANDIDATE_COMMIT" --channel candidate

      - name: Build candidate artifact
        env:
          VITE_PUBLIC_BASE: /japanese/
        run: pnpm build

      - name: Add deterministic callback route
        run: |
          cp apps/web/dist/index.html apps/web/dist/404.html
          mkdir -p apps/web/dist/auth/callback
          cp apps/web/dist/index.html apps/web/dist/auth/callback/index.html

      - name: Upload deployable candidate
        uses: actions/upload-artifact@v4
        with:
          name: p22-candidate-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
