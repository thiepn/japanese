name: CUR-21 Japanese A1 ephemeral main compatibility
on:
  push:
    branches: [feature/cur11-source-grounded-a1-transfer-20261029]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cur21-a1-ephemeral-${{ github.ref }}
  cancel-in-progress: true
jobs:
  main-compat:
    if: github.event_name == 'push' || github.head_ref == 'feature/cur11-source-grounded-a1-transfer-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify unchanged PR head and construct disposable main integration
        env:
          MAIN_SHA: b6acd3fbe99ab5a6b638758145814cd0d13e2be4
          ORIGINAL_BASE: fd25c3c7b26f60eac2061918835c9cf1d315e441
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch --no-tags origin "$MAIN_SHA"
          test "$(git merge-base HEAD "$MAIN_SHA")" = "$ORIGINAL_BASE"
          TREE="$(git merge-tree --write-tree HEAD "$MAIN_SHA")"
          test -n "$TREE"
          git read-tree --reset -u "$TREE"
          test -z "$(git ls-files -u)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Ephemeral integration tree: $TREE" >> "$GITHUB_STEP_SUMMARY"
          echo "PR head: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Independent main: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "No merge commit, branch update, data write, deployment or publication." >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck merged content
        run: pnpm typecheck
      - name: Canonical A1 and resume native regressions
        run: pnpm exec vitest run tests/study-player/cur03-deep-course.test.ts tests/study-player/cur04-navigation.test.ts tests/study-player/cur01-catalog.test.ts
      - name: Production build and source/bundle audits
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: A1 first/return, UI navigation and native Kana integration
        run: pnpm exec playwright test tests/e2e/cur03-deep-course.spec.ts tests/e2e/cur01-catalog.spec.ts tests/e2e/ui-defect-regressions.spec.ts tests/e2e/native-kana.spec.ts --project=desktop-chromium --project=compact-mobile --workers=2 --retries=0
