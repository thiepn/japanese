name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:content
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Record P9 regression evidence
        run: |
          mkdir -p artifacts
          cat > artifacts/p9-regression-evidence.json <<'JSON'
          {
            "typecheck": true,
            "unitTests": true,
            "contentValidation": true,
            "productionBuild": true,
            "e2e": true,
            "offlineDrill": true,
            "providerOutageDrill": true,
            "longHistoryDrill": true
          }
          JSON
      - name: Generate P9 release qualification report
        run: pnpm certify:p9 -- --regression artifacts/p9-regression-evidence.json
      - name: Upload P9 qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: p9-release-qualification
          path: |
            artifacts/p9-release-qualification.json
            artifacts/p9-release-qualification.md
