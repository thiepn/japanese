name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:content
      - name: Validate P10 native candidate queue
        run: pnpm native:p10:preview
      - name: Audit P11.2 native provenance and P9 media gate
        run: pnpm native:p11:audit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Record P9 regression evidence
        run: |
          mkdir -p artifacts
          cat > artifacts/p9-regression-evidence.json <<'JSON'
          {
            "typecheck": true,
            "unitTests": true,
            "contentValidation": true,
            "productionBuild": true,
            "e2e": true,
            "offlineDrill": true,
            "providerOutageDrill": true,
            "longHistoryDrill": true
          }
          JSON
      - name: Generate P9 release qualification report
        run: pnpm certify:p9 --regression artifacts/p9-regression-evidence.json
      - name: Generate P11 release-candidate decision
        run: pnpm qualify:p11 --regression artifacts/p9-regression-evidence.json
      - name: Upload release qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: b2-release-qualification
          path: |
            artifacts/p11-native-source-audit.json
            artifacts/p11-native-source-audit.md
            artifacts/p9-release-qualification.json
            artifacts/p9-release-qualification.md
            artifacts/p11-release-candidate-qualification.json
            artifacts/p11-release-candidate-qualification.md
