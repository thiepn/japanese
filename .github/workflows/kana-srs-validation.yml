name: Kana SRS Focused Validation

on:
  pull_request:
    paths:
      - "apps/web/src/study/kana*.ts"
      - "apps/web/src/study/StudyPlayer.tsx"
      - "apps/web/src/App.tsx"
      - "tests/kana-review.test.ts"
      - "tests/flashcards.test.ts"
      - "tests/local-db/flashcard-storage.test.ts"
      - "apps/web/src/study/flashcards.ts"
      - "apps/web/src/design/FlashcardSession.tsx"
      - "apps/web/src/design/flashcardSession.css"
      - "apps/web/src/design/KanaReview.tsx"
      - "packages/local-db/src/index.ts"
      - "packages/learner-engine/src/index.ts"
      - "tests/e2e/flashcards.spec.ts"
      - "tests/e2e/kana-*.spec.ts"
      - ".github/workflows/kana-srs-validation.yml"
  push:
    branches: [main, feature/kana-anki-flashcards-20261026]
    paths:
      - "apps/web/src/study/kana*.ts"
      - "apps/web/src/study/flashcards.ts"
      - "apps/web/src/study/runtime.ts"
      - "apps/web/src/design/FlashcardSession.tsx"
      - "apps/web/src/design/KanaReview.tsx"
      - "apps/web/src/design/flashcardSession.css"
      - "apps/web/src/study/StudyPlayer.tsx"
      - "apps/web/src/App.tsx"
      - "packages/local-db/src/index.ts"
      - "packages/learner-engine/src/index.ts"
      - "tests/kana-review.test.ts"
      - "tests/flashcards.test.ts"
      - "tests/local-db/flashcard-storage.test.ts"
      - "tests/e2e/flashcards.spec.ts"
      - "tests/e2e/kana-*.spec.ts"
      - ".github/workflows/kana-srs-validation.yml"

jobs:
  kana:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec vitest run tests/kana-review.test.ts tests/flashcards.test.ts tests/local-db/flashcard-storage.test.ts tests/beginner-zero.test.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Existing kana practice and quality (desktop)
        run: env -u CI pnpm exec playwright test tests/e2e/kana-review.spec.ts tests/e2e/kana-quality.spec.ts --project=desktop-chromium --workers=2
      - name: New flashcards (desktop, Android and compact touch)
        run: env -u CI pnpm exec playwright test tests/e2e/flashcards.spec.ts --project=desktop-chromium --project=android-mobile --project=compact-mobile --workers=2
