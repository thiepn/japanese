name: P9 Release Qualification

on:
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:content
      - name: Audit P11.2 native provenance and P9 media gate
        run: pnpm native:p11:audit
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Record regression evidence
        run: |
          mkdir -p artifacts
          cat > artifacts/p9-regression-evidence.json <<'JSON'
          {
            "typecheck": true,
            "unitTests": true,
            "contentValidation": true,
            "productionBuild": true,
            "e2e": true,
            "offlineDrill": true,
            "providerOutageDrill": true,
            "longHistoryDrill": true
          }
          JSON
      - name: Run strict P9 qualification
        run: pnpm certify:p9:strict --regression artifacts/p9-regression-evidence.json
      - name: Upload P9 qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9-release-qualification-strict
          path: |
            artifacts/p11-native-source-audit.json
            artifacts/p11-native-source-audit.md
            artifacts/p9-release-qualification.json
            artifacts/p9-release-qualification.md
