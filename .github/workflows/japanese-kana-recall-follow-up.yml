name: Japanese Kana recall follow-up
on:
  push:
    branches: [integration/japanese-recall-next-20261119]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VITE_PUBLIC_BASE: /japanese/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm validate:content
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Native Kana recall and preservation
        run: env -u CI pnpm exec playwright test tests/e2e/kana-recall-instruction.spec.ts tests/e2e/kana-stage-resume.spec.ts tests/e2e/kana-native-integration.spec.ts tests/e2e/kana-single-app-progress.spec.ts tests/e2e/native-kana.spec.ts --workers=3 --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kana-recall-follow-up
          path: test-results/
          if-no-files-found: ignore
